[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "catalyst-link"
version = "1.0.0"
description = "Catalyst Link: the PC-side companion of Catalyst Tab (read-only code, patch branches, a work-order inbox, Claude through the PC)"
readme = "README.md"
requires-python = ">=3.10"
# anthropic: the api backend; claude-agent-sdk (bundles the Claude Code CLI): the claude-code backend
dependencies = ["anthropic>=1.8", "claude-agent-sdk>=0.2.159"]

[project.optional-dependencies]
mdns = ["zeroconf>=0.130"]
# the desktop app's firmware panel: it runs `python -m esptool` in the interpreter it runs the Link
# with, so esptool has to be installed into that one and not merely on PATH somewhere. 4.7 is the
# first release that writes an ESP32-P4 reliably, which is the chip in a Tab5.
flash = ["esptool>=4.7"]
# the media remote (/media/*): the PC's now-playing through Windows' media controls, album art, volume
media = ["winrt-Windows.Media.Control>=2.0; sys_platform == 'win32'",
         "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
         "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
         "pillow>=10", "pycaw>=20240210; sys_platform == 'win32'"]
# sound to the tablet (audio.py): WASAPI loopback of the default output. pyaudiowpatch is PyAudio with loopback
# added and ships a Windows wheel; numpy mixes down and resamples. Nothing else, and no driver.
audio = ["pyaudiowpatch>=0.2.12.7; sys_platform == 'win32'", "numpy>=1.24"]
# the BLE presence beacon (presence.py): the tablet hears that this PC is awake. Advertising, not
# scanning — bleak, the library everyone reaches for, is a central only and cannot advertise at all. On
# Windows the way through is WinRT's BluetoothLEAdvertisementPublisher, the same projections the media
# remote already uses. There is no Linux or macOS beacon here; `bless` is the library for that if it is
# ever wanted.
presence = ["winrt-Windows.Devices.Bluetooth>=2.0; sys_platform == 'win32'",
            "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
            "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'"]

[project.scripts]
catalyst-link = "catalyst_link.cli:main"

[tool.setuptools]
packages = ["catalyst_link"]
